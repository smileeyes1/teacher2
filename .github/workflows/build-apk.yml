name: Build Android APK (Enterprise Pipeline)

on:
  push:
    branches: [ "main" ]

jobs:
  production-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: ١. استدعاء كود المشروع من المستودع
      uses: actions/checkout@v4

    - name: ٢. تهيئة بيئة جافا المستقرة (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: ٣. تهيئة بيئة نود الحديثة (Node.js 24)
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: ٤. تثبيت حزم الاعتمادات والمكتبات البرمجية
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/cli @capacitor/core @capacitor/android

    - name: ٥. بناء وتهيئة إعدادات Capacitor لـ Android
      run: |
        npx cap init "المنصة التعليمية الذكية" "com.aeic.teacher.app" --web-dir=www || true
        npx cap add android || true

    - name: ٦. مزامنة ملفات الويب داخل كود الاندرويد الأصلي
      run: |
        npx cap sync android

    - name: ٧. تهيئة وتجهيز بيئة الـ Android SDK
      uses: android-actions/setup-android@v3

    - name: ٨. منح صلاحيات التنفيذ لمحرك بناء الاندرويد
      run: chmod +x android/gradlew

    - name: ٩. تجميع وإنتاج تطبيق الـ APK النهائي
      run: |
        cd android
        ./gradlew assembleDebug
        cd ..

    - name: ١٠. رفع وحفظ ملف الـ APK المخرج كأرشيف جاهز للتحميل
      uses: actions/upload-artifact@v4
      with:
        name: Educational-Platform-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
